name: Lint & Format PR Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Format PR Title Link
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let prefix = 'fl';
            let sep = '#';
            try {
              const config = JSON.parse(fs.readFileSync('workflow.config.json', 'utf8'));
              prefix = config.issuePrefix || prefix;
              sep = config.issueSeparator || sep;
            } catch (e) {}

            const title = context.payload.pull_request.title;
            // Match tag like fl#4 without space (which causes GitHub to link to github.com/fl/...)
            const regex = new RegExp(`\\b(${prefix})${sep}(\\d+)\\b`);
            if (regex.test(title)) {
              const formattedTitle = title.replace(regex, `$1 ${sep}$2`);
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                title: formattedTitle
              });
              console.log(`Auto-formatted PR title to: "${formattedTitle}" so GitHub links to ${context.repo.owner}/${context.repo.repo} issues.`);
            }

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn --immutable

      - name: Validate PR Title
        run: |
          echo "${{ github.event.pull_request.title }}" | yarn commitlint
