name: 💡 Feature Request
description: Suggest a new idea or feature for Fluvio
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement or feature!

  - type: dropdown
    id: package
    attributes:
      label: Target Package / Service
      description: Where will this feature live?
      options:
        - apps/web
        - apps/api-gateway
        - apps/user-svc
        - apps/transaction-svc
        - packages/ui
        - Root / Tooling / Architecture
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem? Please describe.
      placeholder: A clear description of what problem this solves...
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: Describe what you want to happen and how you envision it working.
      placeholder: A detailed explanation of your proposed solution...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you considered?
