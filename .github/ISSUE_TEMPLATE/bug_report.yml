name: 🐛 Bug Report
description: Report an issue or bug found in Fluvio
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below.

  - type: dropdown
    id: package
    attributes:
      label: Affected Package / Service
      description: Which part of the monorepo is affected?
      options:
        - apps/web
        - apps/api-gateway
        - apps/user-svc
        - apps/transaction-svc
        - packages/ui
        - Root / Tooling / Infrastructure
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
      placeholder: Describe the expected outcome...
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Screenshots or Logs
      description: Add any relevant logs, terminal output, or screenshots here.
      render: shell
